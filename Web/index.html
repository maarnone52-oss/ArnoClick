<style>
:root{--bg:#0d0e10;--chassis1:#2b2e33;--chassis2:#1e2024;--edge:#3b3f46;--print:#b9bec6;--dim:#7d838c;
 --red:#ff4530;--green:#46ff7a;--amber:#ffb21e;--text:#eceef0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif}
main{max-width:1180px;margin:0 auto;padding:max(18px,calc(env(safe-area-inset-top,0px) / var(--uis,1))) max(16px,calc(env(safe-area-inset-right,0px) / var(--uis,1))) 40px max(16px,calc(env(safe-area-inset-left,0px) / var(--uis,1)))}
.langs{display:flex;gap:6px}
#sizePop{position:fixed;z-index:60;top:calc(calc(env(safe-area-inset-top,0px) / var(--uis,1)) + 70px);right:max(12px,calc(env(safe-area-inset-right,0px) / var(--uis,1)));background:#1b1e23;border:1px solid #3a3f47;border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:8px;max-width:330px}
#sizePop[hidden]{display:none}
#sizePop .sizeRow{display:flex;align-items:center;gap:8px}
#sizePop .sizeRow[hidden]{display:none}
#sizePhone .btn{flex:1;min-width:90px}
html.daw #sizePop{top:auto;bottom:34px}
#sizePop .sizeRow .btn{min-height:44px;min-width:52px;font-size:20px;padding:0 12px}
#sizePop #sizeReset{font-size:14px}
#sizePop b{min-width:64px;text-align:center;font-size:20px;color:#ffc04d;font-variant-numeric:tabular-nums}
#sizePop .note{font-size:13px;color:#9aa0a8}
#helpBtn{min-height:40px;padding:0 12px;font-size:15px}
body.noscroll{overflow:hidden}
#help{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:rgba(0,0,0,.72);display:flex;justify-content:center;align-items:flex-start;padding:max(16px,calc(env(safe-area-inset-top,0px) / var(--uis,1))) 12px 16px;overflow:auto}
#help[hidden]{display:none}
#helpPanel{width:100%;max-width:780px;margin:0;max-height:calc(100vh - 32px);overflow:auto}
.helphead{display:flex;align-items:center;gap:12px;position:sticky;top:-18px;background:linear-gradient(180deg,var(--chassis1),var(--chassis1) 80%,transparent);padding:4px 0 10px;z-index:1}
.helphead .logo{height:40px;width:88px}
.helphead h2{flex:1;margin:0;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--print)}
.helphead .btn{min-height:44px;min-width:44px}
.helptoc{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.helptoc .chip{min-height:36px;padding:0 10px;font-size:13px;border-radius:18px}
#helpBody details{border:1px solid #33373e;border-radius:10px;margin:8px 0;background:rgba(0,0,0,.2)}
#helpBody summary{cursor:pointer;padding:12px 14px;font-weight:700;font-size:16px;list-style:none}
#helpBody summary::-webkit-details-marker{display:none}
#helpBody summary::after{content:"＋";float:right;color:var(--amber)}
#helpBody details[open] summary::after{content:"－"}
.hbody{padding:0 16px 12px;color:#d6d9dd;font-size:15px;line-height:1.55}
.hbody p{margin:8px 0}.hbody ul{margin:8px 0;padding-left:20px}.hbody b{color:#fff}
.modes{display:flex;gap:8px;margin-top:14px}
.modes[hidden]{display:none}
.modes .btn{flex:1;max-width:260px;min-height:50px;font-size:17px}
.modes .btn.on{background:linear-gradient(180deg,#ffc44d,#e89a00);color:#1b1305;border-color:#ffcf6b;border-bottom-color:#7a5000}
.livetop{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.lvside{flex:1;min-width:220px}
.stab{height:12px;border-radius:6px;background:#0a0403;box-shadow:inset 0 2px 4px #000;overflow:hidden;margin:6px 0 4px}
.stab i{display:block;height:100%;width:0;background:#ff4530;transition:width .3s}
.stab i.mid{background:#ffb21e}.stab i.hi{background:#46ff7a;box-shadow:0 0 10px rgba(70,255,122,.6)}
.meter{display:flex;gap:3px;margin:6px 0}
.meter i{flex:1;height:16px;border-radius:2px;background:#0d2a14}
.meter i.a{background:#3a2a06}.meter i.r{background:#3a0e08}
.meter i.on{background:#46ff7a;box-shadow:0 0 6px rgba(70,255,122,.6)}
.meter i.a.on{background:#ffb21e;box-shadow:0 0 6px rgba(255,178,30,.6)}
.meter i.r.on{background:#ff4530;box-shadow:0 0 6px rgba(255,69,48,.7)}
#lvDev{min-height:46px;font-size:15px;max-width:100%;background:#111317;color:var(--text);border:1px solid #3a404b;border-radius:8px;padding:0 10px}
#lvMsg.err{color:#ff8a80}
#lvGo.on{background:linear-gradient(180deg,#ff6a52,#d42a14);border-color:#ff8a77;border-bottom-color:#6e0d03;color:#fff}
.langs .btn{min-height:40px;min-width:52px;padding:0 10px;font-size:15px}
.lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--print);font-weight:600}
.rack{position:relative;background:linear-gradient(180deg,var(--chassis1),var(--chassis2));border:1px solid var(--edge);border-radius:14px;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 12px 30px rgba(0,0,0,.55);padding:18px 22px;margin-bottom:16px}
.rack::before,.rack::after{content:"";position:absolute;top:10px;width:9px;height:9px;border-radius:50%;
 background:radial-gradient(circle at 35% 35%,#8a8f97,#3b3e43 70%);box-shadow:inset 0 0 0 1px #1a1b1e}
.rack::before{left:10px}.rack::after{right:10px}
/* ===== App per Mac: disposizione a pannelli come un DAW (solo finestra larga) ===== */
.dawtop,.dawbody,#dawMain,#dawSide,.dawstatus,.dawtr{display:contents}
.dawlogo,.dawver{display:none}
@media (min-width:980px){
 html.daw,html.daw body{height:100%;overflow:hidden}
 html.daw main{max-width:none;margin:0;padding:0;height:100vh;display:flex;flex-direction:column}
 html.daw footer,html.daw .brand,html.daw .grid:empty{display:none}
 html.daw .dawtop{display:flex;align-items:center;gap:16px;padding:8px 14px;flex:none;background:linear-gradient(180deg,var(--chassis1),var(--chassis2));border-bottom:1px solid #000;box-shadow:0 4px 14px rgba(0,0,0,.45);z-index:2;overflow:hidden}
 html.daw .dawlogo{display:block;height:46px;width:101px;flex:none}
 html.daw .dawtr{display:flex;gap:8px;align-items:center;flex:none}
 html.daw .dawtr #play{min-width:132px}
 html.daw .dawtop .displays{display:flex;gap:10px;align-items:center;flex:none}
 html.daw .dawtop .dbox{padding:4px 8px}
 html.daw .dawtop .range,html.daw .dawtop .ledbox .note,html.daw .dawtop .delta{display:none}
 html.daw .dawtop .ledbox{display:flex;align-items:center;gap:8px}
 html.daw .dawtop .ledbox>.lbl{display:none}
 html.daw .dawtop .leds{padding:0;gap:8px;flex-wrap:nowrap}
 html.daw .dawtop .lamp.big{width:30px;height:30px}
 html.daw .dawtop .bpmrow{gap:10px;flex-wrap:nowrap}
 html.daw #work .transport{margin:0 0 10px;gap:6px}
 html.daw #video{max-height:min(32vh,300px)}
 html.daw:not(.loaded) .dawtop .displays,html.daw:not(.loaded) .dawtr{opacity:.3;pointer-events:none}
 html.daw .dawbody{display:flex;flex:1;min-height:0}
 html.daw #dawMain{display:block;flex:1;min-width:0;overflow-y:auto;padding:12px 14px 20px}
 html.daw #dawSide{display:block;width:350px;flex:none;overflow-y:auto;padding:12px 12px 20px;border-left:1px solid #000;background:#16171a}
 html.daw:not(.loaded) #dawSide{display:none}
 html.daw #dawSide .rack{padding:14px 14px;margin-bottom:12px}
 html.daw #dawSide .rack::before,html.daw #dawSide .rack::after{display:none}
 html.daw #dawSide .mixer{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
 html.daw #dawSide .note{font-size:12px}
 html.daw .dawstatus{display:flex;align-items:center;gap:16px;height:30px;padding:0 12px;flex:none;background:#1b1c20;border-top:1px solid #000;font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden}
 html.daw .dawstatus #status{margin:0;min-height:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
 html.daw .dawstatus .fname{margin:0;font-size:12.5px;color:var(--print);max-width:40%;overflow:hidden;text-overflow:ellipsis;word-break:normal}
 html.daw .dawstatus .fname small{display:none}
 html.daw .dawver{display:inline;flex:none}
 html.daw .dawstatus #uiBtn{min-height:22px;padding:0 10px;font-size:12px}
 html.daw .dawstatus .dawlangs{display:flex;gap:4px;flex-wrap:nowrap;flex:none;align-items:center}
 html.daw .dawstatus .dawlangs .btn{min-height:22px;min-width:0;padding:0 8px;font-size:12px}
 html.daw .dawstatus .dawlangs #themeBtn svg{width:14px;height:14px}
 html.daw .dawstatus .dawlangs #helpBtn,html.daw .dawstatus .dawlangs #themeBtn,html.daw .dawstatus .dawlangs #uiBtn{min-height:22px;height:22px;padding:0 8px;font-size:12px;min-width:0}
 html.daw .tl{display:grid;grid-template-columns:150px minmax(0,1fr);border:1px solid #000;border-radius:8px;overflow:hidden;background:#141518;box-shadow:0 2px 10px rgba(0,0,0,.5)}
 html.daw .tl .dawonly{display:block}
 html.daw .tl .tlh{display:flex;flex-wrap:wrap;align-items:center;align-content:center;gap:4px 7px;padding:4px 8px;background:#24272b;border-bottom:1px solid #000;border-right:1px solid #000;font-size:12.5px;min-width:0}
 html.daw .tl .tlh b{font-size:12.5px}
 html.daw .tl .tlh small{flex-basis:100%;font-size:11px;color:var(--dim);display:flex;align-items:center;gap:4px}
 html.daw .tl .tlh small .lg{margin-left:0;width:12px}
 html.daw .tl .tlc{width:4px;height:15px;border-radius:2px;display:block}
 html.daw .tl .tlh{position:relative;box-sizing:border-box;overflow:hidden}
 html.daw .tl .tlgrip{position:absolute;left:0;right:0;bottom:0;height:6px;cursor:row-resize;z-index:2}
 html.daw .tl .tlgrip:hover{background:rgba(56,198,255,.45)}
 html.daw .tl .tlh.mini{padding-top:0;padding-bottom:0;flex-wrap:nowrap}
 html.daw .tl .tlh.mini small,html.daw .tl .tlh.mini .vu,html.daw .tl .tlh.mini .tlbtns{display:none}
 html.daw .tl .tlh.mini .tlm{min-height:18px;font-size:10.5px;padding:0 4px}
 html.daw .tl .vu{flex-basis:100%;width:100%;height:22px;background:#08090a;border-radius:3px;box-shadow:inset 0 1px 3px #000}
 html.daw .tl #vuC{height:11px}
 html.daw .vux{display:none}
 html.daw .tl .tlm{min-height:24px;min-width:28px;padding:0 6px;font-size:11.5px;margin-left:auto}
 html.daw .tl .tlm.on{background:linear-gradient(180deg,#ffc84a,#f0a100);color:#1a1408}
 html.daw .tl canvas{border-radius:0;box-shadow:none;border-bottom:1px solid #000;margin:0}
 html.daw .tl .tempohead{display:none}
 html.daw #tlRuler{height:36px;background:#1b1d21}
 html.daw #tlVideo{height:64px;background:#000}
 html.daw .tl.novid .tlvid{display:none}
html.lite .vu,html.lite .tl .tlvid{display:none!important}
 html.daw .tl .tlbtns{display:flex;gap:4px;margin-left:auto}
 html.daw .tl .tlbtns .tlm{margin-left:0}
 html.daw #work>.rack>.videobox{display:none}
 html.daw #dawVid{padding:8px 10px 10px;position:relative}
 html.daw #dawVid .vidhead{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--print);user-select:none;-webkit-user-select:none}
 html.daw #dawVid .vidhead .sp{flex:1}
 html.daw #dawVid .vidhead .btn{min-height:28px;padding:0 9px;font-size:12px;letter-spacing:0;text-transform:none}
 html.daw #dawVid .videobox{margin:0}
 html.daw #dawVid #video{max-height:240px}
 html.daw #dawVid.float{position:fixed;z-index:60;width:440px;min-width:240px;max-width:90vw;resize:horizontal;overflow:hidden;margin:0;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--chassis1),var(--chassis2));border:1px solid #000;border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.75)}

.export .exg .btn{padding:9px 12px}

footer{text-align:center;color:var(--dim);font-size:12px;margin-top:24px;letter-spacing:.08em}
@media (max-width:760px){
 .displays{grid-template-columns:1fr 1fr}
 .displays .bpmbox{grid-column:1/-1}
 .bpmrow{gap:10px}
 .delta{font-size:17px;min-width:0}
 #tempo{height:120px}
 #pvWave{height:90px}
 .pvbody{grid-template-columns:1fr}
 .pvmix{grid-template-columns:1fr 1fr}
 .strip.mini .fwrap{height:120px}
 #pvTempo{height:64px}
 .pvtr{gap:6px}
 .pvtr .btn,.pvtr .btn.sq{min-height:42px;min-width:0;padding:0 10px;font-size:14px}
 .pvtr .btn.play{min-width:0;font-size:15px}
 .pvtr .sp,.pvtr .lbl{display:none}
 .pvtime{font-size:12px}
 .mkrow .btn{flex:1 1 40%;padding:0 6px;font-size:15px}
 .snapbtns{width:100%}
 .looprow #loopBtn{flex:1 1 100%}
 #loopInfo{flex:1 1 100%}
 .mkrow .snapbtns .btn{flex:1 1 22%;min-height:42px;font-size:14px}
 .mkrow .lbl{min-width:100%}
 .rack{padding:16px 12px}
 .mixer{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
 .strip .lbl{font-size:9.5px;letter-spacing:.04em}
 .sub{font-size:10.5px;overflow-wrap:anywhere;hyphens:auto}
 .strip{padding:10px 2px}
 .tick b{font-size:8.5px}
 .cap{width:38px;margin-left:-19px}
 .strip .dwin{min-width:0;width:100%}
 .tick b{font-size:9px}
 .cap{width:44px;margin-left:-22px}
 .brand{grid-template-columns:1fr;grid-template-areas:"logo" "tag" "langs";justify-items:center}
 .brand .langs{justify-self:center}
 .logo{height:88px;width:194px}
 .ver{font-size:10px;margin-left:6px;bottom:6px}
 .loadrow{flex-direction:column}
 #lockBtn{min-width:120px;font-size:15px}
 #lockMsg{font-size:11.5px}
 #recBtn{min-height:48px}
 .displays .ledbox{grid-column:1/-1}
 .leds{gap:8px;flex-wrap:nowrap}
 .lamp{width:28px;height:28px}
 .lamp.big{width:42px;height:42px}
 .strip{padding:10px 4px}
 .nudge{width:100%;gap:4px}
 .nudge .btn{flex:1;min-width:0}
}
/* iPhone: marker, aggancio e loop più compatti; niente spiegazioni prima del mixer */
@media (max-width:760px){
 .markers .mkrow,.ced .mkrow{gap:5px;margin-bottom:6px}

>double\x20or\x20half</b>\x20tempo,\x20a\x20click\x20on\x20the\x20<b>off-beat</b>,\x20the\x20<b>downbeat</b>\x20in\x20the\x20wrong\x20place,\x20<b>spikes</b>\x20in\x20the\x20tempo\x20graph\x20where\x20the\x20analysis\x20mistook\x20one\x20hit\x20for\x20another.\x20That\x20is\x20why\x20ARNOCLICK\x20has\x20post-production\x20tools:\x20<b>÷2\x20/\x20×2</b>,\x20a\x20typed\x20BPM\x20with\x20<b>Recalculate</b>,\x20moving\x20the\x20<b>downbeat</b>,\x20the\x20<b>Feel</b>\x20fader\x20(from\x20«follows\x20the\x20song»\x20to\x20«fixed\x20metronome»)\x20and\x20<b>Offset</b>,\x20<b>Analysis\x20resolution</b>\x20(triplets\x20included),\x20and\x20in\x20areas\x20set\x20with\x20the\x20orange\x20markers\x20the\x20click\x20<b>Smoothing</b>,\x20<b>Swings</b>\x20and\x20<b>Tempo</b>,\x20with\x20trial,\x20confirmation\x20and\x20an\x20<b>archive\x20of\x20changes</b>.\x20For\x20the\x20opposite,\x20bringing\x20the\x20music\x20onto\x20a\x20steady\x20tempo,\x20there\x20is\x20<b>⏱\x20Song\x20at\x20fixed\x20tempo</b>\x20(with\x20very\x20free\x20songs\x20the\x20alignment\x20may\x20leave\x20small\x20audible\x20artefacts:\x20always\x20listen\x20to\x20the\x20preview).</p>\x0a<p><b>Checking\x20by\x20ear\x20is\x20always\x20essential.</b>\x20The\x20graph\x20and\x20the\x20numbers\x20show\x20you\x20<i>where</i>\x20to\x20look,\x20but\x20your\x20ear\x20decides\x20whether\x20the\x20click\x20is\x20right.\x20Before\x20exporting,\x20listen\x20to\x20the\x20whole\x20song\x20with\x20the\x20click,\x20especially\x20the\x20start,\x20the\x20ending\x20and\x20tricky\x20passages:\x20use\x20the\x20<b>loop</b>\x20on\x20doubtful\x20spots\x20and\x20the\x20small\x20<b>▶</b>\x20that\x20plays\x20with\x20the\x20click\x20up\x20front\x20(music\x20lower,\x20click\x20louder).\x20Listen\x20on\x20<b>wired\x20headphones</b>\x20or\x20speakers:\x20Bluetooth\x20headphones\x20add\x20a\x20delay\x20that\x20misleads\x20you\x20(use\x20<b>LED\x20sync</b>\x20if\x20needed).\x20After\x20exporting,\x20also\x20check\x20in\x20your\x20sequencer\x20that\x20the\x20MIDI\x20click\x20lands\x20where\x20you\x20expect.</p>\x0a<p><b>Sometimes\x20the\x20right\x20feel\x20is\x20enough.</b>\x20The\x20click\x20does\x20not\x20have\x20to\x20match\x20every\x20hit\x20to\x20the\x20millisecond:\x20musicians\x20naturally\x20play\x20a\x20little\x20ahead\x20of\x20or\x20behind\x20the\x20beat,\x20and\x20differences\x20of\x20a\x20few\x20milliseconds\x20usually\x20go\x20unnoticed.\x20If,\x20playing\x20along,\x20the\x20click\x20«sits»,\x20neither\x20pushing\x20nor\x20dragging,\x20the\x20job\x20is\x20done\x20even\x20if\x20the\x20graph\x20is\x20not\x20perfectly\x20smooth.\x20Conversely,\x20a\x20clean\x20graph\x20does\x20not\x20guarantee\x20a\x20correct\x20click:\x20a\x20click\x20on\x20the\x20off-beat,\x20at\x20double\x20tempo\x20or\x20with\x20the\x20bar\x20shifted\x20can\x20look\x20perfect\x20and\x20still\x20sound\x20wrong.\x20Chasing\x20mathematical\x20perfection\x20on\x20a\x20live\x20performance\x20often\x20makes\x20things\x20worse:\x20better\x20a\x20click\x20that\x20follows\x20the\x20song\x27s\x20breathing\x20naturally.</p>\x0a<p><b>A\x20suggested\x20order\x20of\x20work</b>:\x20①\x20check\x20that\x20the\x20average\x20BPM\x20is\x20plausible\x20(otherwise\x20÷2\x20/\x20×2);\x20②\x20set\x20the\x20bar\x20and\x20downbeat\x20by\x20watching\x20the\x20red\x20LED;\x20③\x20listen\x20to\x20the\x20whole\x20song\x20and\x20note\x20doubtful\x20spots;\x20④\x20fix\x20any\x20overall\x20early\x20or\x20late\x20click\x20with\x20Offset;\x20⑤\x20work\x20only\x20on\x20the\x20areas\x20that\x20need\x20it;\x20⑥\x20listen\x20again,\x20export\x20and\x20check\x20in\x20your\x20sequencer.</p>'],[iR(0x520),iR(0x420)],[iR(0x474),'<p><b>Average\x20BPM</b>:\x20the\x20song\x27s\x20tempo.\x20<b>Current\x20BPM</b>:\x20the\x20tempo\x20where\x20you\x20are\x20listening,\x20averaged\x20over\x20the\x20last\x204\x20beats;\x20next\x20to\x20it\x20▲\x20amber\x20when\x20speeding\x20up,\x20▼\x20blue\x20when\x20slowing\x20down.</p>\x0a<p>The\x20<b>round\x20LEDs</b>\x20flash\x20in\x20time:
