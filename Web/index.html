<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--bg:#0d0e10;--chassis1:#2b2e33;--chassis2:#1e2024;--edge:#3b3f46;--print:#b9bec6;--dim:#7d838c;
 --red:#ff4530;--green:#46ff7a;--amber:#ffb21e;--text:#eceef0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif}
main{max-width:1180px;margin:0 auto;padding:max(18px,calc(env(safe-area-inset-top,0px) / var(--uis,1))) max(16px,calc(env(safe-area-inset-right,0px) / var(--uis,1))) 40px max(16px,calc(env(safe-area-inset-left,0px) / var(--uis,1)))}
.langs{display:flex;gap:6px}
#sizePop{position:fixed;z-index:60;top:calc(calc(env(safe-area-inset-top,0px) / var(--uis,1)) + 70px);right:max(12px,calc(env(safe-area-inset-right,0px) / var(--uis,1)));background:#1b1e23;border:1px solid #3a3f47;border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:8px;max-width:330px}
#sizePop[hidden]{display:none}
#sizePop .sizeRow{display:flex;align-items:center;gap:8px}
#sizePop .sizeRow[hidden]{display:none}
#sizePhone .btn{flex:1;min-width:90px}
html.daw #sizePop{top:auto;bottom:34px}
#sizePop .sizeRow .btn{min-height:44px;min-width:52px;font-size:20px;padding:0 12px}
#sizePop #sizeReset{font-size:14px}
#sizePop b{min-width:64px;text-align:center;font-size:20px;color:#ffc04d;font-variant-numeric:tabular-nums}
#sizePop .note{font-size:13px;color:#9aa0a8}
#helpBtn{min-height:40px;padding:0 12px;font-size:15px}
body.noscroll{overflow:hidden}
#help{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:rgba(0,0,0,.72);display:flex;justify-content:center;align-items:flex-start;padding:max(16px,calc(env(safe-area-inset-top,0px) / var(--uis,1))) 12px 16px;overflow:auto}
#help[hidden]{display:none}
#helpPanel{width:100%;max-width:780px;margin:0;max-height:calc(100vh - 32px);overflow:auto}
.helphead{display:flex;align-items:center;gap:12px;position:sticky;top:-18px;background:linear-gradient(180deg,var(--chassis1),var(--chassis1) 80%,transparent);padding:4px 0 10px;z-index:1}
.helphead .logo{height:40px;width:88px}
.helphead h2{flex:1;margin:0;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--print)}
.helphead .btn{min-height:44px;min-width:44px}
.helptoc{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.helptoc .chip{min-height:36px;padding:0 10px;font-size:13px;border-radius:18px}
#helpBody details{border:1px solid #33373e;border-radius:10px;margin:8px 0;background:rgba(0,0,0,.2)}
#helpBody summary{cursor:pointer;padding:12px 14px;font-weight:700;font-size:16px;list-style:none}
#helpBody summary::-webkit-details-marker{display:none}
#helpBody summary::after{content:"＋";float:right;color:var(--amber)}
#helpBody details[open] summary::after{content:"－"}
.hbody{padding:0 16px 12px;color:#d6d9dd;font-size:15px;line-height:1.55}
.hbody p{margin:8px 0}.hbody ul{margin:8px 0;padding-left:20px}.hbody b{color:#fff}
.modes{display:flex;gap:8px;margin-top:14px}
.modes[hidden]{display:none}
.modes .btn{flex:1;max-width:260px;min-height:50px;font-size:17px}
.modes .btn.on{background:linear-gradient(180deg,#ffc44d,#e89a00);color:#1b1305;border-color:#ffcf6b;border-bottom-color:#7a5000}
.livetop{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.lvside{flex:1;min-width:220px}
.stab{height:12px;border-radius:6px;background:#0a0403;box-shadow:inset 0 2px 4px #000;overflow:hidden;margin:6px 0 4px}
.stab i{display:block;height:100%;width:0;background:#ff4530;transition:width .3s}
.stab i.mid{background:#ffb21e}.stab i.hi{background:#46ff7a;box-shadow:0 0 10px rgba(70,255,122,.6)}
.meter{display:flex;gap:3px;margin:6px 0}
.meter i{flex:1;height:16px;border-radius:2px;background:#0d2a14}
.meter i.a{background:#3a2a06}.meter i.r{background:#3a0e08}
.meter i.on{background:#46ff7a;box-shadow:0 0 6px rgba(70,255,122,.6)}
.meter i.a.on{background:#ffb21e;box-shadow:0 0 6px rgba(255,178,30,.6)}
.meter i.r.on{background:#ff4530;box-shadow:0 0 6px rgba(255,69,48,.7)}
#lvDev{min-height:46px;font-size:15px;max-width:100%;background:#111317;color:var(--text);border:1px solid #3a404b;border-radius:8px;padding:0 10px}
#lvMsg.err{color:#ff8a80}
#lvGo.on{background:linear-gradient(180deg,#ff6a52,#d42a14);border-color:#ff8a77;border-bottom-color:#6e0d03;color:#fff}
.langs .btn{min-height:40px;min-width:52px;padding:0 10px;font-size:15px}
.lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--print);font-weight:600}
.rack{position:relative;background:linear-gradient(180deg,var(--chassis1),var(--chassis2));border:1px solid var(--edge);border-radius:14px;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 12px 30px rgba(0,0,0,.55);padding:18px 22px;margin-bottom:16px}
.rack::before,.rack::after{content:"";position:absolute;top:10px;width:9px;height:9px;border-radius:50%;
 background:radial-gradient(circle at 35% 35%,#8a8f97,#3b3e43 70%);box-shadow:inset 0 0 0 1px #1a1b1e}
.rack::before{left:10px}.rack::after{right:10px}
/* ===== App per Mac: disposizione a pannelli come un DAW (solo finestra larga) ===== */
.dawtop,.dawbody,#dawMain,#dawSide,.dawstatus,.dawtr{display:contents}
.dawlogo,.dawver{display:none}
@media (min-width:980px){
 html.daw,html.daw body{height:100%;overflow:hidden}
 html.daw main{max-width:none;margin:0;padding:0;height:100vh;display:flex;flex-direction:column}
 html.daw footer,html.daw .brand,html.daw .grid:empty{display:none}
 html.daw .dawtop{display:flex;align-items:center;gap:16px;padding:8px 14px;flex:none;background:linear-gradient(180deg,var(--chassis1),var(--chassis2));border-bottom:1px solid #000;box-shadow:0 4px 14px rgba(0,0,0,.45);z-index:2;overflow:hidden}
 html.daw .dawlogo{display:block;height:46px;width:101px;flex:none}
 html.daw .dawtr{display:flex;gap:8px;align-items:center;flex:none}
 html.daw .dawtr #play{min-width:132px}
 html.daw .dawtop .displays{display:flex;gap:10px;align-items:center;flex:none}
 html.daw .dawtop .dbox{padding:4px 8px}
 html.daw .dawtop .range,html.daw .dawtop .ledbox .note,html.daw .dawtop .delta{display:none}
 html.daw .dawtop .ledbox{display:flex;align-items:center;gap:8px}
 html.daw .dawtop .ledbox>.lbl{display:none}
 html.daw .dawtop .leds{padding:0;gap:8px;flex-wrap:nowrap}
 html.daw .dawtop .lamp.big{width:30px;height:30px}
 html.daw .dawtop .bpmrow{gap:10px;flex-wrap:nowrap}
 html.daw #work .transport{margin:0 0 10px;gap:6px}
 html.daw #video{max-height:min(32vh,300px)}
 html.daw:not(.loaded) .dawtop .displays,html.daw:not(.loaded) .dawtr{opacity:.3;pointer-events:none}
 html.daw .dawbody{display:flex;flex:1;min-height:0}
 html.daw #dawMain{display:block;flex:1;min-width:0;overflow-y:auto;padding:12px 14px 20px}
 html.daw #dawSide{display:block;width:350px;flex:none;overflow-y:auto;padding:12px 12px 20px;border-left:1px solid #000;background:#16171a}
 html.daw:not(.loaded) #dawSide{display:none}
 html.daw #dawSide .rack{padding:14px 14px;margin-bottom:12px}
 html.daw #dawSide .rack::before,html.daw #dawSide .rack::after{display:none}
 html.daw #dawSide .mixer{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
 html.daw #dawSide .note{font-size:12px}
 html.daw .dawstatus{display:flex;align-items:center;gap:16px;height:30px;padding:0 12px;flex:none;background:#1b1c20;border-top:1px solid #000;font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden}
 html.daw .dawstatus #status{margin:0;min-height:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
 html.daw .dawstatus .fname{margin:0;font-size:12.5px;color:var(--print);max-width:40%;overflow:hidden;text-overflow:ellipsis;word-break:normal}
 html.daw .dawstatus .fname small{display:none}
 html.daw .dawver{display:inline;flex:none;font-size:15px;font-weight:800;color:#ffb21e;letter-spacing:.04em}
 html.daw .dawstatus #uiBtn{min-height:22px;padding:0 10px;font-size:12px}
 html.daw .dawstatus .dawlangs{display:flex;gap:4px;flex-wrap:nowrap;flex:none;align-items:center}
 html.daw .dawstatus .dawlangs .btn{min-height:22px;min-width:0;padding:0 8px;font-size:12px}
 html.daw .dawstatus .dawlangs #themeBtn svg{width:14px;height:14px}
 html.daw .dawstatus .dawlangs #helpBtn,html.daw .dawstatus .dawlangs #themeBtn,html.daw .dawstatus .dawlangs #uiBtn{min-height:22px;height:22px;padding:0 8px;font-size:12px;min-width:0}
 html.daw .tl{display:grid;grid-template-columns:150px minmax(0,1fr);border:1px solid #000;border-radius:8px;overflow:hidden;background:#141518;box-shadow:0 2px 10px rgba(0,0,0,.5)}
 html.daw .tl .dawonly{display:block}
 html.daw .tl .tlh{display:flex;flex-wrap:wrap;align-items:center;align-content:center;gap:4px 7px;padding:4px 8px;background:#24272b;border-bottom:1px solid #000;border-right:1px solid #000;font-size:12.5px;min-width:0}
 html.daw .tl .tlh b{font-size:12.5px}
 html.daw .tl .tlh small{flex-basis:100%;font-size:11px;color:var(--dim);display:flex;align-items:center;gap:4px}
 html.daw .tl .tlh small .lg{margin-left:0;width:12px}
 html.daw .tl .tlc{width:4px;height:15px;border-radius:2px;display:block}
 html.daw .tl .tlh{position:relative;box-sizing:border-box;overflow:hidden}
 html.daw .tl .tlgrip{position:absolute;left:0;right:0;bottom:0;height:6px;cursor:row-resize;z-index:2}
 html.daw .tl .tlgrip:hover{background:rgba(56,198,255,.45)}
 html.daw .tl .tlh.mini{padding-top:0;padding-bottom:0;flex-wrap:nowrap}
 html.daw .tl .tlh.mini small,html.daw .tl .tlh.mini .vu,html.daw .tl .tlh.mini .tlbtns{display:none}
 html.daw .tl .tlh.mini .tlm{min-height:18px;font-size:10.5px;padding:0 4px}
 html.daw .tl .vu{flex-basis:100%;width:100%;height:22px;background:#08090a;border-radius:3px;box-shadow:inset 0 1px 3px #000}
 html.daw .tl #vuC{height:11px}
 html.daw .vux{display:none}
 html.daw .tl .tlm{min-height:24px;min-width:28px;padding:0 6px;font-size:11.5px;margin-left:auto}
 html.daw .tl .tlm.on{background:linear-gradient(180deg,#ffc84a,#f0a100);color:#1a1408}
 html.daw .tl canvas{border-radius:0;box-shadow:none;border-bottom:1px solid #000;margin:0}
 html.daw .tl .tempohead{display:none}
 html.daw #tlRuler{height:36px;background:#1b1d21}
 html.daw #tlVideo{height:64px;background:#000}
 html.daw .tl.novid .tlvid{display:none}
html.lite .vu,html.lite .tl .tlvid{display:none!important}
 html.daw .tl .tlbtns{display:flex;gap:4px;margin-left:auto}
 html.daw .tl .tlbtns .tlm{margin-left:0}
 html.daw #work>.rack>.videobox{display:none}
 html.daw #dawVid{padding:8px 10px 10px;position:relative}
 html.daw #dawVid .vidhead{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--print);user-select:none;-webkit-user-select:none}
 html.daw #dawVid .vidhead .sp{flex:1}
 html.daw #dawVid .vidhead .btn{min-height:28px;padding:0 9px;font-size:12px;letter-spacing:0;text-transform:none}
 html.daw #dawVid .videobox{margin:0}
 html.daw #dawVid #video{max-height:240px}

t\x20at\x20zero\x20volume\x20those\x20beats\x20are\x20missing,\x20as\x20in\x20the\x20WAV.</li></ul>\x0a<p>The\x20MIDI\x20clicks\x20are\x20the\x20same\x20as\x20the\x20exported\x20WAV,\x20at\x20the\x20same\x20instants\x20(within\x20a\x20hundredth\x20of\x20a\x20millisecond).\x20In\x20the\x20sequencer\x20you\x20can\x20import\x20the\x20track\x20to\x20get\x20the\x20click\x20with\x20any\x20drum\x20sound,\x20or\x20the\x20tempo\x20map\x20so\x20the\x20project\x20follows\x20the\x20song.</p>'},gI={'it':iT(0x61c),'en':iT(0x4e4)},gJ={'it':[[iT(0x735),iT(0x63e)],[iT(0x441),gI['it']],[iT(0x21a),gH['it']],[iT(0x76e),iT(0x2a6)],[iT(0x10c),'<p><b>Che\x20cosa\x20fa\x20ARNOCLICK.</b>\x20Ascolta\x20una\x20traccia\x20audio\x20(o\x20l\x27audio\x20di\x20un\x20video),\x20riconosce\x20i\x20battiti,\x20ne\x20ricava\x20il\x20tempo\x20(BPM)\x20battito\x20per\x20battito\x20e\x20costruisce\x20un\x20click\x20che\x20segue\x20il\x20brano:\x20lo\x20puoi\x20ascoltare\x20insieme\x20alla\x20musica\x20ed\x20esportare\x20in\x20audio\x20(.wav)\x20e\x20in\x20MIDI\x20con\x20la\x20mappa\x20del\x20tempo,\x20pronto\x20per\x20il\x20sequencer.\x20Gran\x20parte\x20del\x20lavoro\x20avviene\x20<b>in\x20automatico</b>.</p>\x0a<p><b>Quando\x20il\x20risultato\x20automatico\x20è\x20eccellente.</b>\x20Con\x20i\x20brani\x20dal\x20ritmo\x20abbastanza\x20stabile:\x20registrati\x20con\x20il\x20click\x20o\x20con\x20una\x20batteria\x20regolare,\x20musica\x20elettronica,\x20brani\x20con\x20attacchi\x20chiari\x20(cassa,\x20rullante,\x20charleston,\x20chitarra\x20ritmica,\x20basso).\x20In\x20questi\x20casi\x20spesso\x20il\x20click\x20è\x20già\x20giusto\x20appena\x20finita\x20l\x27analisi.</p>\x0a<p><b>Quando\x20serve\x20la\x20postproduzione.</b>\x20Alcuni\x20brani\x20mettono\x20in\x20difficoltà\x20qualsiasi\x20analisi\x20automatica,\x20e\x20probabilmente\x20richiederanno\x20un\x20intervento\x20a\x20mano:</p>\x0a<ul><li>esecuzioni\x20dal\x20vivo\x20con\x20accelerazioni,\x20rallentamenti\x20o\x20rubato;\x20introduzioni\x20e\x20finali\x20«a\x20piacere»,\x20corone,\x20pause;</li>\x0a<li>brani\x20senza\x20percussioni\x20o\x20con\x20attacchi\x20morbidi\x20(pianoforte\x20solo,\x20archi,\x20voce,\x20pad),\x20o\x20con\x20molto\x20riverbero;</li>\x0a<li>cambi\x20di\x20tempo\x20o\x20di\x20metro,\x20terzine\x20e\x20swing,\x20sincopi\x20molto\x20marcate;</li>\x0a<li>registrazioni\x20rumorose\x20o\x20molto\x20compresse\x20(per\x20esempio\x20l\x27audio\x20di\x20un\x20video\x20fatto\x20col\x20telefono),\x20dissolvenze\x20in\x20entrata\x20e\x20in\x20uscita.</li></ul>\x0a<p>Gli\x20errori\x20tipici\x20sono:\x20click\x20al\x20<b>doppio\x20o\x20alla\x20metà</b>\x20del\x20tempo,\x20click\x20spostato\x20<b>in\x20levare</b>,\x20<b>primo\x20tempo</b>\x20della\x20battuta\x20nel\x20posto\x20sbagliato,\x20<b>picchi</b>\x20nel\x20grafico\x20del\x20tempo\x20dove\x20l\x27analisi\x20ha\x20preso\x20un\x20colpo\x20per\x20un\x20altro.\x20Per\x20questo\x20ARNOCLICK\x20ha\x20gli\x20strumenti\x20di\x20postproduzione:\x20<b>÷2\x20/\x20×2</b>,\x20BPM\x20scritto\x20a\x20mano\x20con\x20<b>Ricalcola</b>,\x20spostamento\x20del\x20<b>primo\x20tempo</b>,\x20fader\x20<b>Andamento</b>\x20(da\x20«segue\x20il\x20brano»\x20a\x20«metronomo\x20fisso»)\x20e\x20<b>Allineamento</b>,\x20<b>Risoluzione\x20dell\x27analisi</b>\x20(terzine\x20comprese),\x20e\x20nelle\x20aree\x20scelte\x20con\x20i\x20marker\x20arancioni\x20<b>Ammorbidimento</b>,\x20<b>Oscillazioni</b>\x20e\x20<b>Tempo</b>\x20del\x20click,\x20con\x20prova,\x20conferma\x20e\x20<b>archivio\x20delle\x20modifiche</b>.\x20Se\x20serve\x20il\x20contrario,\x20cioè\x20portare\x20la\x20musica\x20su\x20un\x20tempo\x20costante,\x20c\x27è\x20<b>⏱\x20Brano\x20a\x20tempo\x20fisso</b>\x20(con\x20i\x20brani\x20molto\x20liberi\x20l\x27allineamento\x20può\x20lasciare\x20piccoli\x20difetti\x20udibili:\x20ascolta\x20sempre\x20l\x27anteprima).</p>\x0a<p><b>La\x20verifica\x20ad\x20orecchio\x20è\x20sempre\x20indispensabile.</b>\x20Il\x20grafico\x20e\x20i\x20numeri\x20indicano\x20<i>dove</i>\x20guardare,\x20ma\x20è\x20l\x27orecchio\x20a\x20decidere\x20se\x20il\x20click\x20è\x20giusto.\x20Prima\x20di\x20esportare\x20ascolta\x20tutto\x20il\x20brano\x20con\x20il\x20click,\x20soprattutto\x20inizio,\x20finale\x20e\x20passaggi\x20delicati:\x20usa\x20il\x20<b>loop</b>\x20sui\x20punti\x20dubbi\x20e\x20il\x20piccolo\x20<b>▶</b>\x20che\x20ascolta\x20con\x20il\x20click\x20in\x20primo\x20piano\x20(musica\x20più\x20bassa,\x20click\x20più\x20alto).\x20Ascolta\x20in\x20<b>cuffie\x20con\x20il\x20filo</b>\x20o\x20dagli\x20altoparlanti:\x20le\x20cuffie\x20Bluetooth\x20aggiungono\x20un\x20ritardo\x20che\x20inganna\x20(regola\x20semmai\x20<b>Sincro\x20LED</b>).\x20Dopo\x20l\x27esportazione,\x20controlla\x20anche\x20nel\x20sequencer\x20che\x20il\x20click\x20MIDI\x20cada\x20dove\x20ti\x20aspetti.</p>\x0a<p><b>A\x20volte\x20basta\x20la\x20sensazione\x20giusta.</b>\x20Il\x20click\x20non\x20deve\x20coincidere\x20al\x20millisecondo\x20con\x20ogni\x20colpo:\x20i\x20musicisti\x20suonano\x20naturalmente\x20un\x20po\x27\x20avanti\x20o\x20un\x20po\x27\x20indietro,\x20e\x20differenze\x20di\x20pochi\x20millesimi\x20di\x20secondo\x20di\x20solito\x20non\x20si\x20avvertono.\x20Se\x20suonando\x20sopra\x20al\x20brano\x20il\x20click\x20«tiene»,\x20non\x20tira\x20e\x20non\x20trattiene,\x20il\x20lavoro\x20è\x20fatto\x20anche\x20se\x20il\x20grafico\x20non\x20è\x20perfettamente\x20liscio.\x20Al\x20contrario,\x20un\x20grafico\x20pulito\x20non\x20garantisce\x20che\x20il\x20click\x20sia\x20giusto:\x20un\x20click\x20messo\x20in\x20levare,\x20al\x20doppio\x20o\x20con\x20la\x20battuta\x20spostata\x20può\x20sembrare\x20perfetto\x20a\x20vederlo\x20e\x20risultare\x20sbagliato\x20all\x27ascolto.\x20Inseguire\x20la\x20perfezione\x20matematica\x20su\x20un\x20brano\x20suonato\x20dal\x20vivo\x20spesso\x20peggiora\x20il\x20risultato:\x20meglio\x20un\x20click\x20che\x20segue\x20con\x20naturalezza\x20il\x20respiro\x20del\x20brano.</p>\x0a<p><b>Un\x20ordine\x20di\x20lavoro\x20consigliato</b>:\x20①\x20controlla\x20che\x20il\x20BPM\x20medio\x20sia\x20plausibile\x20(altrimenti\x20÷2\x20/\x20×2);\x20②\x20sistema\x20battuta\x20e\x20primo\x20tempo\x20guardando\x20il\x20LED\x20rosso;\x20③\x20ascolta\x20tutto\x20il\x20brano\x20e\x20annota\x20i\x20punti\x20dubbi;\x20④\x20correggi\x20l\x27eventuale\x20anticipo\x20o\x20ritardo\x20generale\x20con\x20Allineamento;\x20⑤\x20intervieni\x20solo\x20sulle\x20aree\x20che\x20lo\x20richiedono;\x20⑥\x20riascolta,\x20esporta\x20e\x20verifica\x20nel\x20sequencer.</p>'],['🚀\x20Per\x20iniziare',iT(0x1d7)],[iT(0x34c),iT(0x15b)],[iT(0x7cd),'<p>Sulla\x20forma\x20d\x27onda\x20le\x20linee\x20<b>rosse</b>\x20sono\x20i\x20primi\x20tempi\x20(con\x20il\x20numero\x20di\x20battuta),\x20le\x20<b>verdi</b>\x20gli\x20altri\x20tempi;\x20la\x20linea\x20<b>bianca</b>\x20è\x20il\x20cursore.</p>\x0a<p>Il\x20<b>grafico\x20del\x20tempo</b>\x20mostra\x20in\x20rosso\x20il\x20tempo\x20del\x20brano\x20battito\x20per\x20battito,\x20in\x20verde\x20quello\x20del\x20click\x20e\x20tratteggiato\x20il\x20BPM\x20medio.</p>\x0a<p>Un\x20tocco\x20sposta\x20il\x20cursore,\x20trascinando\x20scorri\x20la\x20vista.\x20Zoom:\x20<b>−\x20+\x20Tutto</b>,\x20<b>due\x20dita</b>\x20sul\x20telefono,\x20<b>rotella\x20del\x20mouse</b>\x20o\x20pizzico\x20sul\x20trackpad\x20sul\x20Mac\x20(Maiusc\x20+\x20rotella\x20sposta\x20la\x20vista).\x20Il\x20punto\x20fermo\x20dello\x20zoom\x20è\x20il\x20cursore.</p>\x0a<p><b>Risoluzione\x20dell\x27analisi</b>:\x20per\x20trovare\x20i\x20battiti\x20ARNOCLICK\x20guarda\x20anche\x20gli\x20attacchi\x20in\x20mezzo,\x20alle\x20suddivisioni\x20scelte\x20(<b>1/8</b>,\x20<b>1/16</b>\x20(quella\x20normale),\x20<b>1/32</b>,\x20<b>1/64</b>\x20e\x20le\x20terzine\x20<b>1/8T</b>,\x20<b>1/16T</b>,\x20<b>1/32T</b>,\x20<b>1/64T</b>\x20per\x20i\x20brani\x20in\x20terzine):\x20un\x20battito\x20è\x20più\x20sicuro\x20se\x20anche\x20le\x20suddivisioni\x20cadono\x20al\x20posto\x20giusto.\x20Con\x20<b>1/4</b>\x20guarda\x20solo\x20i\x20battiti,\x20come\x20nelle\x20versioni\x20precedenti.</p>\x0a<p><b>Prova\x20e\x20modifiche\x20applicate</b>:\x20i\x20cursori\x20«Click»\x20(ammorbidimento,\x20oscillazioni\x20e\x20tempo)\x20fanno\x20una\x20<b>prova</b>:\x20la\x20senti\x20subito\x20mentre\x20ascolti\x20e\x20la\x20vedi\x20sul\x20grafico\x20(riquadro\x20arancione\x20tratteggiato),\x20ma\x20non\x20è\x20salvata.\x20Per\x20tenerla\x20premi\x20<b>✔\x20Applica\x20la\x20modifica</b>\x20e\x20tocca\x20di\x20nuovo\x20per\x20confermare;\x20con\x20<b>⟲\x20Azzera\x20i\x207\x20cursori</b>\x20torna\x20tutto\x20com\x27era.\x20Le\x20modifiche\x20applicate\x20finiscono\x20nell\x27archivio\x20<b>Modifiche\x20applicate</b>,\x20numerate\x20(#1,\x20#2…)\x20e\x20segnate\x20in\x20verde\x20sul\x20grafico.\x20Ogni\x20modifica\x20tiene\x20anche\x20le\x20posizioni\x20dei\x204\x20cursori\x20dell\x27area:\x20dopo\x20averla\x20applicata\x20restano\x20dove\x20sono,\x20e\x20toccandola\x20nell\x27archivio\x20la\x20vedi\x20sul\x20grafico\x20e\x20cursori\x20e\x20marker\x20arancioni\x20tornano\x20lì,\x20pronti\x20per\x20ritoccarla\x20(<b>✔\x20Sovrascrivi\x20la\x20modifica</b>,\x20con\x20conferma;\x20puoi\x20anche\x20spostare\x20i\x20marker\x20arancioni).\x20Ogni\x20locazione\x20ha\x20la\x20sua\x20cronologia:\x20con\x20<b>‹\x20›</b>\x20passi\x20da\x20una\x20versione\x20all\x27altra\x20e\x20con\x20<b>⌫</b>\x20ne\x20togli\x20una;\x20ogni\x20area\x20ha\x20<b>un\x20solo</b>\x20posto\x20nell\x27archivio\x20e\x20una\x20sola\x20serie\x20di\x20modifiche;\x20le\x20aree\x20possono\x20sovrapporsi\x20o\x20contenersi,\x20ma\x20i\x20loro\x20limiti\x20non\x20possono\x20coincidere.\x20Sul\x20grafico\x20ogni\x20area\x20ha\x20una\x20linguetta\x20con\x20il\x20suo\x20numero.\x20Toccando\x20una\x20modifica\x20nell\x27archivio\x20(o\x20la\x20sua\x20linguetta\x20sul\x20grafico)\x20la\x20selezioni:\x20la\x20sua\x20area\x20si\x20evidenzia,\x20<b>una\x20alla\x20volta</b>,\x20e\x20tornano\x20cursori\x20e\x20marker;\x20tocca\x20di\x20nuovo\x20per\x20deselezionarla.\x20La\x20casella\x20a\x20sinistra\x20passa\x20dal\x20modificato\x20(✓)\x20all\x27originale\x20(vuota)\x20e\x20viceversa;\x20<b>🗑</b>\x20(con\x20conferma)\x20la\x20elimina\x20per\x20sempre.\x20L\x27archivio\x20si\x20salva\x20con\x20il\x20brano.</p>\x0a<p>Nella\x20sezione\x20<b>Esporta</b>,\x20il\x20riquadro\x20<b>Click\x20corretto</b>\x20salva\x20il\x20click\x20audio\x20(.wav)\x20e\x20MIDI\x20(.mid)\x20come\x20lo\x20senti\x20adesso,\x20con\x20tutte\x20le\x20modifiche\x20attive,\x20l\x27Andamento\x20e\x20l\x27Allineamento.</p>\x0a<p><b>Ammorbidimento</b>:\x20nella\x20sezione\x20Marker\x20metti\x20i\x20due\x20marker\x20arancioni\x20<b>⟦\x20Inizio\x20area</b>\x20e\x20<b>Fine\x20area\x20⟧</b>\x20ai\x20lati\x20del\x20tratto\x20in\x20cui\x20il\x20grafico\x20del\x20tempo\x20ha\x20picchi\x20esagerati\x20(si\x20mettono\x20sul\x20cursore\x20e\x20si\x20trascinano\x20come\x20gli\x20altri),\x20poi\x20muovi\x20il\x20cursore\x20Ammorbidimento.\x20A\x200%\x20il\x20click\x20resta\x20com\x27è,\x20a\x20100%\x20il\x20tempo\x20passa\x20in\x20linea\x20retta\x20da\x20quello\x20prima\x20a\x20quello\x20dopo\x20il\x20tratto;\x20in\x20mezzo\x20il\x20passaggio\x20è\x20continuo.\x20Cambia\x20solo\x20il\x20click\x20(curva\x20verde)\x20fra\x20i\x20marker:\x20la\x20curva\x20rossa\x20del\x20brano\x20resta\x20com\x27è.\x20Il\x20tratto\x20ammorbidito\x20resta\x20segnato\x20in\x20verde;\x20riportando\x20il\x20cursore\x20a\x200%\x20si\x20toglie.\x20Due\x20altri\x20cursori\x20agiscono\x20sempre\x20solo\x20sul\x20click\x20dell\x27area:\x20<b>Click\x20·\x20oscillazioni</b>\x20(al\x20100%\x20invariate;\x20abbassando,\x20i\x20su\x20e\x20giù\x20della\x20curva\x20verde\x20si\x20schiacciano\x20verso\x20il\x20tempo\x20medio\x20dell\x27area,\x20fino\x20a\x20renderla\x20piatta;\x20gli\x20estremi\x20dell\x27area\x20restano\x20fermi)\x20e\x20<b>Click\x20·\x20tempo</b>\x20(alza\x20o\x20abbassa\x20il\x20tempo\x20del\x20click\x20nell\x27area\x20fino\x20a\x20±20%;\x20attenzione:\x20dopo\x20l\x27area\x20il\x20click\x20non\x20è\x20più\x20allineato\x20alla\x20musica).\x20Un\x20doppio\x20tocco\x20
