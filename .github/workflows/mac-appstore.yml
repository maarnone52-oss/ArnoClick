# App Mac per il Mac App Store: la compila su un Mac di GitHub con Xcode 26, la firma e la carica
# su App Store Connect. Nel repository pubblico i minuti su Mac sono gratuiti.
# Si avvia a mano: scheda Actions → "App Mac per il Mac App Store" → Run workflow,
# scegliendo il ramo «mac-appstore» (3.1.13 con ascolto dal vivo a cattura nativa).
# Usa gli stessi 5 segreti dell'app iPhone (APPLE_TEAM_ID, APP_BUNDLE_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8):
# stessa scheda app, con la piattaforma macOS (acquisto universale).
# Carica soltanto la build: l'invio in revisione si fa da App Store Connect.
name: App Mac per il Mac App Store

on:
  workflow_dispatch:
    inputs:
      numero_build:
        description: "Numero di build (vuoto = numero progressivo del flusso). Deve essere maggiore di quello della build Mac già caricata."
        required: false
        default: ''

jobs:
  appstore:
    runs-on: macos-15
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUILD_NUM: ${{ inputs.numero_build || github.run_number }}
    steps:
      - name: Controlla i segreti Apple
        run: |
          for v in TEAM_ID BUNDLE_ID KEY_ID ISSUER_ID KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Manca il segreto per $v"; exit 1; fi
          done

      - uses: actions/checkout@v4

      - name: Scegli Xcode 26 o successivo
        run: |
          XC=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XC" ]; then echo "::error::Xcode 26 non trovato su questo Mac di GitHub"; ls /Applications | grep Xcode; exit 1; fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Genera il progetto Xcode e i permessi
        run: |
          brew install xcodegen
          xcodegen generate
          # modalità protetta (sandbox) richiesta dal Mac App Store: microfono e scheda audio,
          # file scelti dall'utente con i pannelli del Finder, motore della pagina (WebKit)
          cat > "$RUNNER_TEMP/ArnoClick-Mac.entitlements" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.app-sandbox</key><true/>
            <key>com.apple.security.device.audio-input</key><true/>
            <key>com.apple.security.files.user-selected.read-write</key><true/>
            <key>com.apple.security.network.client</key><true/>
          </dict></plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ArnoClick-Mac.entitlements"
          VER=$(sed -n 's/.*MARKETING_VERSION: "\([0-9.]*\)".*/\1/p' project.yml | head -1)
          echo "Versione $VER, build $BUILD_NUM"

      - name: Libera i certificati delle compilazioni precedenti
        # Ogni Mac di GitHub è nuovo e Xcode crea certificati nuovi a ogni compilazione:
        # Apple ne permette pochi, quindi prima si revocano quelli vecchi creati dal cloud.
        # Le app già su App Store e su TestFlight non ne risentono.
        run: |
          python3 -m pip install -q --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install -q pyjwt cryptography
          python3 - <<'PY'
          import os, time, json, urllib.request, jwt
          key=os.environ["KEY_P8"]; kid=os.environ["KEY_ID"]; iss=os.environ["ISSUER_ID"]
          tok=jwt.encode({"iss":iss,"iat":int(time.time()),"exp":int(time.time())+600,"aud":"appstoreconnect-v1"},key,algorithm="ES256",headers={"kid":kid,"typ":"JWT"})
          def call(method,url):
              r=urllib.request.Request(url,method=method,headers={"Authorization":"Bearer "+tok})
              with urllib.request.urlopen(r) as f: return json.loads(f.read() or b"{}")
          certs=call("GET","https://api.appstoreconnect.apple.com/v1/certificates?limit=200")["data"]
          tipi=("DEVELOPMENT","IOS_DEVELOPMENT","DISTRIBUTION","IOS_DISTRIBUTION","MAC_APP_DEVELOPMENT","MAC_APP_DISTRIBUTION","MAC_INSTALLER_DISTRIBUTION")
          for c in certs:
              a=c["attributes"]
              if a.get("certificateType") in tipi:
                  try:
                      call("DELETE","https://api.appstoreconnect.apple.com/v1/certificates/"+c["id"])
                      print("revocato:",a.get("certificateType"),a.get("name"),a.get("expirationDate"))
                  except Exception as e:
                      print("non revocato:",a.get("name"),e)
          PY

      - name: Archivia e firma
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          xcodebuild -project ArnoClick.xcodeproj -scheme ArnoClickMac \
            -destination 'generic/platform=macOS' -configuration Release \
            -archivePath "$RUNNER_TEMP/ArnoClickMac.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Development" \
            CODE_SIGN_ENTITLEMENTS="$RUNNER_TEMP/ArnoClick-Mac.entitlements" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM" \
            archive | tail -n 60

      - name: Controlla permessi e versione dell'archivio
        run: |
          APP="$RUNNER_TEMP/ArnoClickMac.xcarchive/Products/Applications/ArnoClick.app"
          test -d "$APP"
          codesign -d --entitlements :- "$APP" 2>/dev/null | grep -E "com.apple.security" || true
          grep -q "com.apple.security.app-sandbox" <(codesign -d --entitlements :- "$APP" 2>/dev/null) || { echo "::error::sandbox non attiva"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist"
          lipo -archs "$APP/Contents/MacOS/"*

      - name: Firma per il Mac App Store e carica su App Store Connect
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ArnoClickMac.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" | tail -n 60
          echo "::notice::Caricata la build Mac $BUILD_NUM: tra 10-30 minuti la trovi in App Store Connect, nella pagina della versione macOS."
